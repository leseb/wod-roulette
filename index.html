<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WOD Roulette">
<title>WOD Roulette</title>
<style>
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes cardFlip {
  0% { transform: rotateX(0) scale(1); }
  30% { transform: rotateX(90deg) scale(0.9); }
  60% { transform: rotateX(0deg) scale(1.02); }
  100% { transform: rotateX(0deg) scale(1); }
}
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.4); }
  50% { box-shadow: 0 0 0 12px rgba(255,107,53,0); }
}
@keyframes slotSpin {
  0% { transform: translateY(0); opacity: 1; }
  20% { transform: translateY(-40px); opacity: 0; }
  40% { transform: translateY(40px); opacity: 0; }
  60% { transform: translateY(20px); opacity: 0.5; }
  80% { transform: translateY(-5px); opacity: 0.9; }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes confetti {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-200px) rotate(720deg); opacity: 0; }
}
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.6; }
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
  background: #050508;
  color: #f0f0f0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
  padding-top: max(env(safe-area-inset-top, 20px), 20px);
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(255,107,53,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.05) 0%, transparent 50%);
  animation: glowPulse 8s ease-in-out infinite;
  pointer-events: none;
  z-index: 0;
}
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}
.orb-1 { width: 300px; height: 300px; background: rgba(255,107,53,0.08); top: -100px; right: -100px; }
.orb-2 { width: 250px; height: 250px; background: rgba(139,92,246,0.06); bottom: 10%; left: -80px; }

.header {
  text-align: center;
  margin-bottom: 20px;
  width: 100%;
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.6s ease-out;
}
.logo {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #555;
  margin-bottom: 8px;
}
.header h1 {
  font-size: 36px;
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #ff6b35 0%, #f7c948 50%, #ff6b35 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
}
.header .subtitle {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
  font-weight: 500;
}

.filters {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  width: 100%;
  max-width: 420px;
  background: #111;
  border-radius: 14px;
  padding: 4px;
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.6s ease-out 0.1s both;
}
.filter-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 11px;
  background: transparent;
  color: #666;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  letter-spacing: 0.5px;
}
.filter-btn.active {
  color: #fff;
  background: #1e1e1e;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.filter-btn.active[data-filter="HYROX"] { color: #ff6b35; }
.filter-btn.active[data-filter="SAVAGE"] { color: #8b5cf6; }
.filter-btn.active[data-filter="all"] { color: #f7c948; }

.toggle-row {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.6s ease-out 0.15s both;
}
.toggle-btn {
  padding: 8px 18px;
  border: 1px solid #222;
  border-radius: 20px;
  background: #111;
  color: #555;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}
.toggle-btn.active {
  background: rgba(239, 68, 68, 0.12);
  color: #ef4444;
  border-color: rgba(239, 68, 68, 0.4);
}

.card-container {
  width: 100%;
  max-width: 420px;
  perspective: 1000px;
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.6s ease-out 0.2s both;
}
.card {
  width: 100%;
  background: linear-gradient(165deg, #141416 0%, #1a1a1e 100%);
  border-radius: 24px;
  padding: 28px 24px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,255,255,0.05) inset;
  transition: transform 0.3s ease;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}
.card.flipping {
  animation: cardFlip 0.5s ease-in-out;
}
.card.spinning .wod-content {
  animation: slotSpin 0.5s ease-out;
}

.badge-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.badge.hyrox {
  background: linear-gradient(135deg, #ff6b35, #e85520);
  color: #fff;
  box-shadow: 0 2px 12px rgba(255,107,53,0.3);
}
.badge.savage {
  background: linear-gradient(135deg, #8b5cf6, #7c3aed);
  color: #fff;
  box-shadow: 0 2px 12px rgba(139,92,246,0.3);
}
.badge-icon { font-size: 14px; }
.wod-number {
  font-size: 11px;
  color: #444;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.badge-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border: 1px solid #222;
  border-radius: 9px;
  background: #151518;
  color: #888;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.copy-btn:active { transform: scale(0.92); }
.copy-btn svg { width: 13px; height: 13px; }
.copy-btn.copied {
  background: rgba(34,197,94,0.12);
  color: #22c55e;
  border-color: rgba(34,197,94,0.4);
}

.wod-desc {
  font-size: 16px;
  line-height: 1.7;
  white-space: pre-line;
  color: #ccc;
  font-weight: 400;
}

.divider {
  width: 40px;
  height: 2px;
  border-radius: 1px;
  background: #222;
  margin: 16px 0;
}

.actions {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.6s ease-out 0.3s both;
}
.btn {
  flex: 1;
  padding: 16px;
  border: none;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.3px;
}
.btn:active { transform: scale(0.95); }
.btn-roll {
  background: linear-gradient(135deg, #ff6b35 0%, #e85520 100%);
  color: #fff;
  box-shadow: 0 4px 20px rgba(255,107,53,0.3);
  animation: pulse 2s infinite;
}
.btn-roll:active { box-shadow: 0 2px 10px rgba(255,107,53,0.2); animation: none; }
.btn-roll::after {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: linear-gradient(transparent, rgba(255,255,255,0.1), transparent);
  transform: rotate(45deg);
  transition: 0.5s;
  pointer-events: none;
}
.btn-daily {
  background: #151518;
  color: #666;
  border: 1px solid #222;
}
.btn-daily.active-mode {
  background: linear-gradient(165deg, #1a1810, #151410);
  color: #f7c948;
  border-color: rgba(247,201,72,0.3);
  box-shadow: 0 4px 20px rgba(247,201,72,0.1);
}

.stats {
  margin-top: 24px;
  display: flex;
  gap: 20px;
  justify-content: center;
  position: relative;
  z-index: 1;
  animation: fadeInUp 0.6s ease-out 0.4s both;
}
.stat {
  text-align: center;
}
.stat-value {
  font-size: 22px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.stat-value.orange { color: #ff6b35; }
.stat-value.purple { color: #8b5cf6; }
.stat-value.gold { color: #f7c948; }
.stat-label {
  font-size: 10px;
  color: #555;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 2px;
}

.confetti-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 100;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  animation: confetti 0.8s ease-out forwards;
}

.swipe-hint {
  margin-top: 16px;
  font-size: 11px;
  color: #333;
  text-align: center;
  animation: float 3s ease-in-out infinite;
  position: relative;
  z-index: 1;
}

.history-toggle {
  margin-top: 24px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
}
.history-btn {
  width: 100%;
  padding: 12px;
  background: #111;
  border: 1px solid #1a1a1a;
  border-radius: 14px;
  color: #444;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.3s;
}
.history-btn:active { background: #151518; }
.history-list {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}
.history-list.open { max-height: 500px; }
.history-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: #0e0e10;
  border-radius: 10px;
  margin-top: 6px;
  border: 1px solid #1a1a1a;
}
.history-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.history-dot.hyrox { background: #ff6b35; }
.history-dot.savage { background: #8b5cf6; }
.history-text {
  font-size: 12px;
  color: #555;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-empty {
  font-size: 12px;
  color: #444;
  padding: 10px 14px;
  margin-top: 6px;
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="confetti-container" id="confetti"></div>

<div class="header">
  <div class="logo">CrossFit Quo Vadis</div>
  <h1>WOD Roulette</h1>
  <div class="subtitle" id="today"></div>
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="all">Tous</button>
  <button class="filter-btn" data-filter="HYROX">HYROX</button>
  <button class="filter-btn" data-filter="SAVAGE">Savage</button>
</div>

<div class="toggle-row">
  <button class="toggle-btn" id="no-run-btn" onclick="toggleNoRun()">No Run</button>
  <button class="toggle-btn" id="only-push-btn" onclick="toggleOnlyPush()">Push-ups</button>
</div>

<div class="card-container">
  <div class="card" id="wod-card">
    <div class="badge-row">

      <div class="badge-right">
        <span class="wod-number" id="wod-number">#1 / 438</span>
        <button class="copy-btn" id="copy-btn" onclick="copyWod()" aria-label="Copier le WOD"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span id="copy-label">Copier</span></button>
      </div>
    </div>
    <div class="wod-content" id="wod-content">
      <div class="divider"></div>
      <div class="wod-desc" id="wod-desc"></div>

  </div>
</div>

<div class="actions">
  <button class="btn btn-daily active-mode" id="btn-daily" onclick="toggleMode()">WOD du jour</button>
  <button class="btn btn-roll" id="btn-roll" onclick="roll()">Re-tirer</button>
</div>

<div class="stats">
  <div class="stat"><div class="stat-value orange" id="stat-hyrox">338</div><div class="stat-label">HYROX</div></div>
  <div class="stat"><div class="stat-value gold" id="stat-total">445</div><div class="stat-label">Total</div></div>
  <div class="stat"><div class="stat-value purple" id="stat-savage">107</div><div class="stat-label">Savage</div></div>
</div>

<div class="swipe-hint">Swipe la carte pour re-tirer</div>

<div class="history-toggle">
  <button class="history-btn" id="history-btn" onclick="toggleHistory()">Historique des tirages</button>
  <div class="history-list" id="history-list"></div>
</div>

let filter = 'all';
let dailyMode = true;
let noRun = false;
let onlyPush = false;
let history = [];
let currentIdx = -1;
let currentWod = null;

const RUN_PATTERN = /\b(run|running|treadmill)\b/i;
// Match real push-ups (push up, push-up, pushup, HSPU) but NOT
// "sled push", "push press" or "push jerk".
const PUSH_PATTERN = /\bhspu\b|push[-\s]?ups?\b/i;

function getFiltered() {
  let pool = WODS;
  if (filter !== 'all') pool = pool.filter(w => w.type === filter);
  if (noRun) pool = pool.filter(w => !RUN_PATTERN.test(w.description));
  if (onlyPush) pool = pool.filter(w => PUSH_PATTERN.test(w.description));
  return pool;
}

function toggleNoRun() {
  noRun = !noRun;
  document.getElementById('no-run-btn').classList.toggle('active', noRun);
  const [wod, idx] = dailyMode ? pickDaily() : pickRandom();
  if (wod) display(wod, idx, true);
}

function toggleOnlyPush() {
  onlyPush = !onlyPush;
  document.getElementById('only-push-btn').classList.toggle('active', onlyPush);
  const [wod, idx] = dailyMode ? pickDaily() : pickRandom();
  if (wod) display(wod, idx, true);
}

function seededRandom(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function todaySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
}

function pickDaily() {
  const pool = getFiltered();
  if (!pool.length) return [null, -1];
  const idx = Math.floor(seededRandom(todaySeed() + filter.length * 7) * pool.length);
  return [pool[idx], idx];
}

function pickRandom() {
  const pool = getFiltered();
  if (!pool.length) return [null, -1];
  const idx = Math.floor(Math.random() * pool.length);
  return [pool[idx], idx];
}

const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function spawnConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#ff6b35','#f7c948','#8b5cf6','#22c55e','#3b82f6','#ec4899'];
  const card = document.getElementById('wod-card');
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height * 0.3;
  for (let i = 0; i < 20; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.left = cx + (Math.random() - 0.5) * 200 + 'px';
    piece.style.top = cy + 'px';
    piece.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
    piece.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 1000);
  }
}

function display(wod, idx, animate) {
  if (!wod) return;
  const card = document.getElementById('wod-card');
  const pool = getFiltered();
  
  if (animate) {
    card.classList.add('flipping');
    card.querySelector('.wod-content').style.opacity = '0';
    setTimeout(() => {
      updateCard(wod, idx, pool);
      card.querySelector('.wod-content').style.opacity = '1';
      card.classList.add('spinning');
      setTimeout(() => {
        card.classList.remove('flipping', 'spinning');
      }, 500);
    }, 200);
    spawnConfetti();
  } else {
    updateCard(wod, idx, pool);
  }
}

function updateCard(wod, idx, pool) {
  const card = document.getElementById('wod-card');
  const badge = document.getElementById('wod-badge');
  const icon = document.getElementById('badge-icon');
  const text = document.getElementById('badge-text');
  
  card.className = 'card ' + wod.type.toLowerCase() + '-card';
  text.textContent = wod.type;
  badge.className = 'badge ' + wod.type.toLowerCase();
  
  document.getElementById('wod-number').textContent = '#' + (idx+1) + ' / ' + pool.length;
  document.getElementById('wod-desc').textContent = wod.description.trim();
  currentWod = wod;
  
  const hc = filter === 'all' ? WODS.filter(w=>w.type==='HYROX').length : (filter==='HYROX' ? pool.length : 0);
  const sc = filter === 'all' ? WODS.filter(w=>w.type==='SAVAGE').length : (filter==='SAVAGE' ? pool.length : 0);
  document.getElementById('stat-hyrox').textContent = WODS.filter(w=>w.type==='HYROX').length;
  document.getElementById('stat-savage').textContent = WODS.filter(w=>w.type==='SAVAGE').length;
  document.getElementById('stat-total').textContent = pool.length;
}

function copyWod() {
  if (!currentWod) return;
  const text = currentWod.type + '\n\n' + currentWod.description.trim();
  const btn = document.getElementById('copy-btn');
  const label = document.getElementById('copy-label');
  const done = () => {
    btn.classList.add('copied');
    label.textContent = 'Copié !';
    setTimeout(() => { btn.classList.remove('copied'); label.textContent = 'Copier'; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallbackCopy.bind(null, text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function addToHistory(wod) {
  if (!wod) return;
  const desc = wod.description.trim().split('\n')[0].substring(0, 50);
  history.unshift({ type: wod.type, desc: desc });
  if (history.length > 3) history.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!history.length) {
    list.innerHTML = '<div class="history-empty">Aucun tirage précédent</div>';
    return;
  }
  list.innerHTML = history.map(h =>
    '<div class="history-item">' +
    '<div class="history-dot ' + h.type.toLowerCase() + '"></div>' +
    '<div class="history-text">' + h.desc + '</div>' +
    '</div>'
  ).join('');
}

function toggleHistory() {
  const list = document.getElementById('history-list');
  list.classList.toggle('open');
  const btn = document.getElementById('history-btn');
  btn.textContent = list.classList.contains('open') ? 'Masquer l\u2019historique' : 'Historique des tirages';
}

function roll() {
  dailyMode = false;
  document.getElementById('btn-daily').classList.remove('active-mode');
  const [wod, idx] = pickRandom();
  if (wod) {
    // Record the WOD we're swapping away from, so the last 3 are visible.
    addToHistory(currentWod);
    display(wod, idx, true);
  }
}

function toggleMode() {
  dailyMode = true;
  document.getElementById('btn-daily').classList.add('active-mode');
  const [wod, idx] = pickDaily();
  if (wod) display(wod, idx, true);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    const [wod, idx] = dailyMode ? pickDaily() : pickRandom();
    if (wod) display(wod, idx, true);
  });
});

// Swipe support
let touchStartX = 0;
const cardEl = document.getElementById('wod-card');
cardEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
